# =====================================================================
#  unu Charge Monitor – Home Assistant Package
#  Live-Ladeanzeige für den unu-Akku (Scooter Pro, 1778 Wh) mit dem
#  Original-Ladegerät an einer smarten Steckdose mit Leistungsmessung.
#
#  Ablage: /config/packages/unu_laden.yaml
#  Anleitung: siehe README.md
#
#  VOR DEM EINSATZ ANPASSEN (Suchen & Ersetzen):
#    1. mobile_app_DEIN_HANDY  -> dein Notify-Dienst (ohne "notify.")
#    2. unu_charger            -> nur nötig, wenn deine Steckdose anders heißt.
#       Erwartet werden: switch.unu_charger,
#                        sensor.unu_charger_power  (Leistung in W),
#                        sensor.unu_charger_energy (Energiezähler in kWh)
#
#  Referenzmessung (Original-Ladegerät, zwei Akkus):
#    Spitzenleistung ~303 W, Knick bei ~91 %, Abfallphase ~71 min,
#    Abschalten bei ~35 W, danach ~4 W, Vollladung ~1875 Wh ab Steckdose.
#  Eigene Werte: im Abschnitt "Kalibrierung" unter template: eintragen.
# =====================================================================

input_number:
  # --- intern ---
  unu_start_soc:
    name: unu Ladestand bei Ladestart
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  unu_start_energie:
    name: unu Zählerstand bei Ladestart
    min: 0
    max: 1000000
    step: 0.001
    unit_of_measurement: kWh
    mode: box
  unu_p_max:
    name: unu Höchste Leistung dieser Ladung
    min: 0
    max: 5000
    step: 0.1
    unit_of_measurement: W
    mode: box

input_boolean:
  unu_laedt:
    name: unu lädt gerade
    icon: mdi:battery-charging
  unu_live_activity:
    name: unu Live Activity
    icon: mdi:cellphone-text

sensor:
  # Zeitgewichteter Mittelwert der letzten 3 Minuten (kurze Aussetzer fallen kaum ins Gewicht)
  - platform: statistics
    name: unu Ladeleistung
    unique_id: unu_ladeleistung_mean
    entity_id: sensor.unu_charger_power
    state_characteristic: average_step
    max_age:
      minutes: 3
    sampling_size: 300
    keep_last_sample: true

template:
  - binary_sensor:
      - name: unu Abfallphase
        unique_id: unu_abfallphase
        state: >
          {% if is_state('input_boolean.unu_laedt', 'on') and not has_value('sensor.unu_charger_power') %}
            {# Steckdose liefert gerade keinen Wert -> letzten Zustand behalten #}
            {{ this.state == 'on' }}
          {% else %}
            {% set p_peak = states('sensor.unu_kalibrierung_spitzenleistung') | float(303) %}
            {% set p = states('sensor.unu_ladeleistung') | float(states('sensor.unu_charger_power') | float(0)) %}
            {% set p_max = states('input_number.unu_p_max') | float(0) %}
            {% set seit = now() - states.input_boolean.unu_laedt.last_changed %}
            {{ is_state('input_boolean.unu_laedt', 'on') and (
                 (p_max >= 0.7 * p_peak and p < 0.93 * p_max)
                 or (seit > timedelta(minutes=10) and p_max < 0.7 * p_peak) ) }}
          {% endif %}

  - sensor:
      # ---------- Kalibrierung (fest, in der Oberfläche nicht änderbar) ----------
      # Werte nur hier in der Datei anpassen.
      - name: unu Kalibrierung Energie Vollladung
        unique_id: unu_kal_wh_voll_fest
        unit_of_measurement: Wh
        icon: mdi:battery-charging-100
        state: "1875"
      - name: unu Kalibrierung Spitzenleistung
        unique_id: unu_kal_p_spitze_fest
        unit_of_measurement: W
        icon: mdi:flash
        state: "303"
      - name: unu Kalibrierung Dauer Abfallphase
        unique_id: unu_kal_abfall_min_fest
        unit_of_measurement: min
        icon: mdi:timer-sand
        state: "71"

      - name: unu Geladen
        unique_id: unu_geladen_wh
        unit_of_measurement: Wh
        device_class: energy
        state: >
          {{ ((states('sensor.unu_charger_energy') | float(0)
              - states('input_number.unu_start_energie') | float(0)) * 1000) | round(0) }}

      - name: unu Ladestand
        unique_id: unu_ladestand_geschaetzt
        unit_of_measurement: "%"
        device_class: battery
        state: >
          {% if is_state('input_boolean.unu_laedt', 'off') or not has_value('sensor.unu_charger_power') %}
            {# nicht am Laden oder Steckdose ohne Wert -> letzten Wert behalten #}
            {{ this.state if this.state not in ['unknown', 'unavailable'] else 0 }}
          {% else %}
            {% set wh_voll = states('sensor.unu_kalibrierung_energie_vollladung') | float(1875) %}
            {% set p = states('sensor.unu_ladeleistung') | float(states('sensor.unu_charger_power') | float(0)) %}
            {% set p_max = [states('input_number.unu_p_max') | float(0), 1] | max %}
            {# Abfallphase aus Messung: [Leistung / Höchstleistung, Ladestand %] #}
            {% set cv = [[0.99,91],[0.91,92],[0.83,93],[0.74,94.3],[0.66,95.3],[0.58,96.2],
                         [0.50,97],[0.41,97.8],[0.33,98.5],[0.25,99.1],[0.17,99.7],[0.13,100]] %}
            {% if is_state('binary_sensor.unu_abfallphase', 'on') %}
              {% set r = p / p_max %}
              {% if r >= cv[0][0] %}
                {% set s = cv[0][1] %}
              {% elif r <= cv[-1][0] %}
                {% set s = 100 %}
              {% else %}
                {% set ns = namespace(s=100) %}
                {% for i in range(cv | length - 1) %}
                  {% set a = cv[i] %}{% set b = cv[i + 1] %}
                  {% if r <= a[0] and r >= b[0] %}
                    {% set ns.s = a[1] + (a[0] - r) / (a[0] - b[0]) * (b[1] - a[1]) %}
                  {% endif %}
                {% endfor %}
                {% set s = ns.s %}
              {% endif %}
            {% else %}
              {# Konstantstrom-Phase: Startwert + geladene Energie, höchstens bis zum Knick #}
              {% set s = [states('input_number.unu_start_soc') | float(0)
                          + states('sensor.unu_geladen') | float(0) / wh_voll * 100, 90] | min %}
            {% endif %}
            {{ ([[s, 0] | max, 100] | min) | round(0) }}
          {% endif %}

      - name: unu Restzeit
        unique_id: unu_restzeit
        unit_of_measurement: min
        device_class: duration
        state: >
          {% if is_state('input_boolean.unu_laedt', 'off') %}
            0
          {% elif not has_value('sensor.unu_charger_power') %}
            {{ this.state if this.state not in ['unknown', 'unavailable'] else 0 }}
          {% else %}
            {% set wh_voll = states('sensor.unu_kalibrierung_energie_vollladung') | float(1875) %}
            {% set cv_min = states('sensor.unu_kalibrierung_dauer_abfallphase') | float(71) %}
            {% set p = states('sensor.unu_ladeleistung') | float(states('sensor.unu_charger_power') | float(0)) %}
            {% set p_max = [states('input_number.unu_p_max') | float(0), 1] | max %}
            {# Abfallphase aus Messung: [Leistung / Höchstleistung, Restminuten] #}
            {% set cv = [[0.99,71],[0.91,66],[0.83,61],[0.74,56],[0.66,50],[0.58,45],
                         [0.50,40],[0.41,33],[0.33,26],[0.25,18],[0.17,7],[0.13,0]] %}
            {% if is_state('binary_sensor.unu_abfallphase', 'on') %}
              {% set r = p / p_max %}
              {% if r >= cv[0][0] %}
                {% set m = cv[0][1] %}
              {% elif r <= cv[-1][0] %}
                {% set m = 0 %}
              {% else %}
                {% set ns = namespace(m=0) %}
                {% for i in range(cv | length - 1) %}
                  {% set a = cv[i] %}{% set b = cv[i + 1] %}
                  {% if r <= a[0] and r >= b[0] %}
                    {% set ns.m = a[1] + (a[0] - r) / (a[0] - b[0]) * (b[1] - a[1]) %}
                  {% endif %}
                {% endfor %}
                {% set m = ns.m %}
              {% endif %}
            {% else %}
              {# Konstantstrom-Phase: Energie bis zum Knick (91 %) / Leistung + Abfallphase #}
              {% set soc = states('sensor.unu_ladestand') | float(0) %}
              {% set m = ([91 - soc, 0] | max) / 100 * wh_voll / ([p, 1] | max) * 60 + cv_min %}
            {% endif %}
            {{ ([m, 0] | max) | round(0) }}
          {% endif %}

script:
  # 12 min nach der Fertig-Meldung (= 15 min nach Ladeende) Steckdose abschalten,
  # damit das BMS am Ende noch Zeit hat. Wird abgebrochen, falls inzwischen
  # wieder geladen wird.
  unu_steckdose_aus_verzoegert:
    alias: unu Steckdose verzögert ausschalten
    icon: mdi:power-plug-off-outline
    mode: restart
    sequence:
      - delay: "00:12:00"
      - condition: state
        entity_id: input_boolean.unu_laedt
        state: "off"
      - condition: numeric_state
        entity_id: sensor.unu_charger_power
        below: 20
      - action: switch.turn_off
        target:
          entity_id: switch.unu_charger

# Häufig laufende Hilfs-Automationen nicht unter "Aktivität" anzeigen
logbook:
  exclude:
    entities:
      - automation.unu_live_activity_aktualisieren
      - automation.unu_hochstleistung_merken

automation:
  # ======================= Hauptautomation =======================
  - id: unu_ladeanzeige
    alias: unu Ladeanzeige
    description: Live-Ladeanzeige für den unu-Akku auf Basis der gemessenen Ladekurve
    mode: queued
    max: 5
    triggers:
      - trigger: numeric_state
        entity_id: sensor.unu_charger_power
        above: 20
        for: "00:00:30"
        id: start
      - trigger: numeric_state
        entity_id: sensor.unu_charger_power
        above: 20
        for: "00:04:00"
        id: soc_auto
      - trigger: state
        entity_id: input_boolean.unu_live_activity
        to: "off"
        id: live_aus
      - trigger: numeric_state
        entity_id: sensor.unu_charger_power
        below: 12       # Abschalten bei ~35 W, danach 4 W Erhaltungsleistung
        for: "00:03:00"
        id: ende
    variables:
      wh: "{{ states('sensor.unu_geladen') | int(0) }}"
    actions:
      - choose:
          # ---------- Ladestart ----------
          - conditions:
              - condition: trigger
                id: start
              - condition: state
                entity_id: input_boolean.unu_laedt
                state: "off"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.unu_start_energie
                data:
                  value: "{{ states('sensor.unu_charger_energy') | float(0) }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.unu_p_max
                data:
                  value: 0
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.unu_laedt

          # ---------- Startladestand automatisch aus der Leistung bestimmen ----------
          # Tabelle aus der Messung: [Leistung / Spitzenleistung, Ladestand %]
          # (Werte unter 38 % aus dem Verlauf hochgerechnet)
          - conditions:
              - condition: trigger
                id: soc_auto
              - condition: state
                entity_id: input_boolean.unu_laedt
                state: "on"
              - condition: template   # nur wenn die Leistung noch steigt (= nicht schon fast voll)
                value_template: >
                  {{ states('sensor.unu_charger_power') | float(0)
                     >= 0.97 * states('input_number.unu_p_max') | float(0) }}
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.unu_start_soc
                data:
                  value: >
                    {% set r = states('sensor.unu_charger_power') | float(0)
                               / states('sensor.unu_kalibrierung_spitzenleistung') | float(303) %}
                    {% set kurve = [[0.81,0],[0.85,20],[0.888,38],[0.901,45],[0.917,53],[0.934,58],
                                    [0.95,68],[0.961,73],[0.976,78],[0.984,84],[1.0,90]] %}
                    {% if r <= kurve[0][0] %}
                      {% set soc = 0 %}
                    {% elif r >= kurve[-1][0] %}
                      {% set soc = 90 %}
                    {% else %}
                      {% set ns = namespace(soc=0) %}
                      {% for i in range(kurve | length - 1) %}
                        {% set a = kurve[i] %}{% set b = kurve[i + 1] %}
                        {% if r >= a[0] and r <= b[0] %}
                          {% set ns.soc = a[1] + (r - a[0]) / (b[0] - a[0]) * (b[1] - a[1]) %}
                        {% endif %}
                      {% endfor %}
                      {% set soc = ns.soc %}
                    {% endif %}
                    {# Energie der ersten 4 Minuten abziehen -> Ladestand beim Einstecken #}
                    {% set korr = states('sensor.unu_geladen') | float(0)
                                  / states('sensor.unu_kalibrierung_energie_vollladung') | float(1875) * 100 %}
                    {{ ([soc - korr, 0] | max) | round(0) }}

          # ---------- Ladeende ----------
          - conditions:
              - condition: trigger
                id: ende
              - condition: state
                entity_id: input_boolean.unu_laedt
                state: "on"
            sequence:
              # Echte Vollladung = Abfallphase lief schon länger als 10 min
              - variables:
                  voll: >
                    {{ is_state('binary_sensor.unu_abfallphase', 'on') and
                       now() - states.binary_sensor.unu_abfallphase.last_changed > timedelta(minutes=10) }}
                  start: "{{ states('input_number.unu_start_soc') | float(0) }}"
                  soc_abbruch: >
                    {{ ([start + wh / (states('sensor.unu_kalibrierung_energie_vollladung') | float(1875)) * 100, 99]
                        | min) | round(0) | int }}
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.unu_laedt
              # Eintrag unter "Aktivität" (Logbuch) für spätere Kalibrierung
              - action: logbook.log
                data:
                  name: UNU Charger
                  entity_id: input_boolean.unu_laedt
                  message: >-
                    {{ 'Ladung beendet' if voll else 'Ladung abgebrochen' }}: {{ wh }} Wh,
                    Start {{ start | int }} %, Spitze {{ states('input_number.unu_p_max') }} W
                    {%- if voll and start < 90 %}, hochgerechnet Vollladung {{ (wh / (100 - start) * 100) | round(0) }} Wh{% endif %}
              # Live Activity beenden ...
              - action: notify.mobile_app_DEIN_HANDY
                data:
                  message: clear_notification
                  data:
                    tag: unu-laden
              # ... und stattdessen eine normale Push-Nachricht
              - action: notify.mobile_app_DEIN_HANDY
                data:
                  title: UNU Charger
                  message: >-
                    {% if voll %}Akku voll geladen · {{ wh }} Wh{% else %}Laden abgebrochen bei ~{{ soc_abbruch }} % · {{ wh }} Wh{% endif %}
                  data:
                    tag: unu-laden-fertig
              # Nach erfolgreicher Vollladung die Steckdose verzögert abschalten
              # (Skript läuft im Hintergrund weiter; bei Abbruch bleibt sie an)
              - if:
                  - condition: template
                    value_template: "{{ voll }}"
                then:
                  - action: script.turn_on
                    target:
                      entity_id: script.unu_steckdose_aus_verzoegert

          # ---------- Live Activity per Schalter ausgeschaltet -> sofort entfernen ----------
          - conditions:
              - condition: trigger
                id: live_aus
            sequence:
              - action: notify.mobile_app_DEIN_HANDY
                data:
                  message: clear_notification
                  data:
                    tag: unu-laden

  # ============ Live Activity aktualisieren (eigene Automation) ============
  # Bedingungen auf Automationsebene: läuft nur, wenn geladen wird und die
  # Live Activity eingeschaltet ist -> keine Einträge, wenn nichts passiert.
  - id: unu_live_activity_update
    alias: unu Live Activity aktualisieren
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/5"   # iOS drosselt häufigere Updates
      - trigger: state
        entity_id: input_boolean.unu_laedt
        to: "on"
      - trigger: state
        entity_id: input_boolean.unu_live_activity
        to: "on"
      - trigger: event
        event_type: automation_reloaded
    conditions:
      - condition: state
        entity_id: input_boolean.unu_laedt
        state: "on"
      - condition: state
        entity_id: input_boolean.unu_live_activity
        state: "on"
      - condition: template   # keine Werte senden, solange die Steckdose keinen Wert liefert
        value_template: "{{ has_value('sensor.unu_charger_power') }}"
    variables:
      soc: "{{ states('sensor.unu_ladestand') | int(0) }}"
      rest: "{{ states('sensor.unu_restzeit') | int(0) }}"
      watt: >
        {{ states('sensor.unu_ladeleistung') | float(states('sensor.unu_charger_power') | float(0))
           | round(0) | int }}
      farbe: >
        {% if soc < 20 %}#F44336{% elif soc < 50 %}#FF9800{% elif soc < 80 %}#4CAF50{% else %}#8BC34A{% endif %}
    actions:
      - action: notify.mobile_app_DEIN_HANDY
        data:
          title: UNU Charger
          message: >-
            {{ watt }} W ~{{ (now() + timedelta(minutes=rest)).strftime('%H:%M') }}
          data:
            tag: unu-laden
            live_update: true
            silent: true
            alert_once: true
            critical_text: "{{ soc }} %"
            progress: "{{ soc }}"
            progress_max: 100
            notification_icon: mdi:moped-electric-outline
            notification_icon_color: "{{ farbe }}"
            color: "{{ farbe }}"

  # ============ Höchstleistung mitschreiben (eigene Automation) ============
  - id: unu_p_max
    alias: unu Höchstleistung merken
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id:
          - sensor.unu_ladeleistung
          - sensor.unu_charger_power
    conditions:
      - condition: state
        entity_id: input_boolean.unu_laedt
        state: "on"
      # Geglätteten Wert bevorzugen; Rohwert nur, wenn die Glättung gerade nichts liefert
      - condition: template
        value_template: >
          {{ trigger.entity_id == 'sensor.unu_ladeleistung'
             or not has_value('sensor.unu_ladeleistung') }}
      - condition: template
        value_template: >
          {{ trigger.to_state.state | float(0) > states('input_number.unu_p_max') | float(0) }}
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.unu_p_max
        data:
          value: "{{ trigger.to_state.state | float(0) | round(1) }}"
